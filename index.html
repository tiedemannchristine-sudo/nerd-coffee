<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERNEL & INIT — jetzt auf lenoko.de</title>
<meta name="description" content="KERNEL und INIT: Specialty Coffee für Devs und Nerds. Jetzt direkt bei LeNoKo auf lenoko.de.">
<meta http-equiv="refresh" content="2; url=https://lenoko.de/pages/kernel-und-init">
<link rel="canonical" href="https://lenoko.de/pages/kernel-und-init">
<style>
  :root { --bg:#0a0c0f; --panel:#111419; --border:#1e2430; --accent:#00ff9d; --accent2:#00c4ff; --text:#c8d0e0; --muted:#4a5568; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono','Consolas','Menlo',ui-monospace,monospace;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem; position:relative; overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(rgba(0,255,157,0.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,255,157,0.03) 1px,transparent 1px);
    background-size:40px 40px;
  }
  body::after {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);
  }
  .box {
    position:relative; z-index:1;
    max-width:560px; width:100%;
    background:var(--panel); border:1px solid var(--border); padding:2.5rem;
  }
  .box::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
  }
  .prompt { font-size:0.65rem; color:var(--muted); letter-spacing:0.15em; margin-bottom:1.5rem; }
  .prompt .pu { color:var(--accent); } .prompt .ph { color:var(--accent2); }
  h1 {
    font-size:clamp(1.8rem,5vw,2.4rem); font-weight:800; letter-spacing:-0.02em;
    margin-bottom:0.5rem; line-height:1.1;
  }
  h1 .k { color:var(--accent); } h1 .amp { color:var(--muted); } h1 .i { color:var(--accent2); }
  p {
    font-family:'Space Grotesk',sans-serif;
    font-size:0.95rem; line-height:1.65; color:var(--text); margin-top:1rem;
  }
  p a { color:var(--accent2); text-decoration:none; }
  p a:hover { text-decoration:underline; }
  .cta {
    display:inline-block; margin-top:1.8rem;
    background:var(--accent); color:var(--bg);
    padding:0.9rem 1.8rem; font-family:'JetBrains Mono',monospace;
    font-size:0.75rem; font-weight:800; letter-spacing:0.15em; text-transform:uppercase;
    text-decoration:none; transition:transform 0.15s, box-shadow 0.15s;
    box-shadow:0 4px 20px rgba(0,255,157,0.25);
  }
  .cta:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,255,157,0.4); }
  .meta { font-size:0.6rem; color:var(--muted); margin-top:1.8rem; letter-spacing:0.1em; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .cursor {
    display:inline-block; width:0.5em; height:1em;
    background:var(--accent); animation:blink 1s infinite;
    vertical-align:text-bottom; margin-left:4px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="prompt"><span class="pu">root@lenoko</span>:<span class="ph">~</span>$ redirect --to=lenoko.de<span class="cursor"></span></div>
    <h1><span class="k">KERNEL</span><span class="amp"> &amp; </span><span class="i">INIT</span></h1>
    <p>sind in den Hauptshop auf <strong>lenoko.de</strong> umgezogen. In 2 Sekunden geht es automatisch dort weiter — oder manuell:</p>
    <a class="cta" href="https://lenoko.de/pages/kernel-und-init">→ jetzt bei lenoko.de weitermachen</a>
    <div class="meta">// LeNoKo Rösterei · Linz am Rhein</div>
  </div>
  <script>
    // JS-Redirect zusätzlich zum meta-refresh (falls meta blockiert ist)
    setTimeout(function(){ window.location.replace('https://lenoko.de/pages/kernel-und-init'); }, 1800);
  </script>
</body>
</html>
